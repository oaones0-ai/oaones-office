# OAones OfficeUnit browser preview. Keep this file ASCII-only.
# Empty include_dirs means all knowledge-document directories.
# Includes match descendants; exclude_dirs wins.
officeunit.preview.enabled=true
officeunit.preview.include_dirs=
officeunit.preview.exclude_dirs=
officeunit.preview.admin_ids=
officeunit.preview.mode=browser-js
officeunit.preview.max_input_bytes=52428800
officeunit.preview.max_uncompressed_bytes=209715200
officeunit.preview.max_archive_entries=10000
officeunit.preview.max_compression_ratio=100
officeunit.preview.max_xml_bytes=20971520
officeunit.preview.max_page_count=2000
officeunit.preview.max_sheet_count=50
officeunit.preview.max_cell_count=1000000
officeunit.preview.max_slide_count=500
officeunit.preview.max_shape_count=50000
officeunit.preview.max_asset_bytes=52428800
officeunit.preview.parse_timeout_seconds=30
officeunit.preview.ticket_ttl_seconds=600
officeunit.preview.allow_external_links=false
officeunit.preview.allow_remote_fonts=false
officeunit.preview.allow_macro_formats=false
officeunit.preview.legacy_action=download
officeunit.preview.native_formats=pdf,ofd,txt,log,sql,js,css,json,xml,html,htm,md,png,jpg,jpeg,gif,bmp,webp,svg,tif,tiff,cad,dwg,dxf
